{# Infobox d'un projet. Attend la variable `project`. Toute la case est un lien vers la page du projet. #}
<a class="infobox"
   href="{{ url_for('projets.projet', slug=project.slug) }}"
   data-type="{{ project.type }}"
   data-stack="{{ project.stack | join('|') }}">
  <div class="infobox-meta">
    <span class="infobox-type">{{ types[project.type] }}</span>
    <time>{{ project.date }}</time>
  </div>
  <h3 class="infobox-title">{{ project.nom }}</h3>
  <p class="infobox-text">{{ project.court }}</p>
  <ul class="tags">
    {% for s in project.stack %}<li>{{ s }}</li>{% endfor %}
  </ul>
</a>
